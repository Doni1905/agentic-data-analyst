services:
  postgres:
    image: postgres:16
    container_name: ada-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ada}
      POSTGRES_DB: ${POSTGRES_DB:-sales_db}
    ports:
      - "5432:5432"
    volumes:
      - ada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ada -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ada_pgdata:
